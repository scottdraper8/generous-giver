name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Required quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes -r requirements.txt

      - name: Audit the hash-locked toolchain
        run: pip-audit --requirement requirements.txt --strict

      - name: Run every repository hook
        run: pre-commit run --all-files --show-diff-on-failure
