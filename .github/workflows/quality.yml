name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Required quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes -r requirements.txt

      - name: Audit the hash-locked toolchain
        run: pip-audit --requirement requirements.txt --strict

      - name: Run every repository hook
        run: pre-commit run --all-files --show-diff-on-failure
