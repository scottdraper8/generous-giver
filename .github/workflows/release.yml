name: Release

on:
  push:
    branches:
      - main
    paths:
      - fomod/**
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release; must match fomod/info.xml.
        required: true
        type: string
      publish_to_nexus:
        description: Upload new versions to the existing Nexus files. Leave off for GitHub-only updates.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generous-giver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version and package
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      publish_nexus: ${{ steps.version.outputs.publish_nexus }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for a new version and validate the FOMOD package
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_TO_NEXUS: ${{ inputs.publish_to_nexus }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def read_version(xml_text):
              root = ET.fromstring(xml_text)
              version = root.findtext("Version")
              if version is None or not re.fullmatch(r"\d+\.\d+(?:\.\d+)?", version):
                  raise SystemExit(f"Unsupported or missing release version: {version!r}")
              return version

          event_name = os.environ["EVENT_NAME"]
          current_xml = Path("fomod/info.xml").read_text(encoding="utf-8")
          current = read_version(current_xml)
          output = Path(os.environ["GITHUB_OUTPUT"])
          subprocess.run(
              [sys.executable, "scripts/build_release_assets.py", "--validate-only"],
              check=True,
          )

          if event_name == "workflow_dispatch":
              if os.environ["REF_NAME"] != "main":
                  raise SystemExit("Manual releases must be run from main.")
              requested = os.environ["RELEASE_VERSION"]
              if requested != current:
                  raise SystemExit(
                      f"Requested release {requested!r} does not match FOMOD version {current!r}."
                  )
              publish_nexus = os.environ["PUBLISH_TO_NEXUS"].lower() == "true"
          elif event_name == "push":
              publish_nexus = True
              before = os.environ["BEFORE_SHA"]
              if not before or set(before) == {"0"}:
                  print("::notice::No prior commit is available for comparison; release skipped.")
                  output.write_text(
                      f"publish=false\npublish_nexus=false\nversion={current}\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              previous_xml = subprocess.run(
                  ["git", "show", f"{before}:fomod/info.xml"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              previous = read_version(previous_xml)

              def version_tuple(value):
                  parts = [int(part) for part in value.split(".")]
                  return tuple((parts + [0, 0, 0])[:3])

              if current == previous or version_tuple(current) == version_tuple(previous):
                  print(f"::notice::FOMOD version remains {current}; release skipped.")
                  output.write_text(
                      f"publish=false\npublish_nexus=false\nversion={current}\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              if version_tuple(current) <= version_tuple(previous):
                  raise SystemExit(
                      f"Release version must increase: {previous} -> {current}"
                  )
          else:
              raise SystemExit(f"Unsupported workflow event: {event_name}")

          output.write_text(
              f"publish=true\npublish_nexus={str(publish_nexus).lower()}\nversion={current}\n",
              encoding="utf-8",
          )
          print(f"Validated FOMOD package for release v{current}.")
          PY

  package:
    name: Build release archives
    needs: validate-version
    if: needs.validate-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the FOMOD installer and standalone variants
        id: package
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/generous-giver-release-assets"
          mkdir -p "$assets_dir"
          python3 scripts/build_release_assets.py "$assets_dir"
          jq -e --arg version "$VERSION" '.version == $version and (.release_assets | length) == 9 and (.nexus_files | length) == 9' \
            "$assets_dir/manifest.json" >/dev/null

      - name: Upload the generated archives for release jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generous-giver-release-assets
          path: ${{ runner.temp }}/generous-giver-release-assets/
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    name: Create or update the GitHub Release
    needs: [validate-version, package]
    if: needs.validate-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download the release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generous-giver-release-assets
          path: release-assets

      - name: Create or update the GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mapfile -t filenames < <(jq -r '.release_assets[]' release-assets/manifest.json)
          if [[ "${#filenames[@]}" -ne 9 ]]; then
            echo "Expected one installer and eight optional archives." >&2
            exit 1
          fi
          assets=()
          for filename in "${filenames[@]}"; do
            if [[ "$filename" == GenerousGiver-*.zip ]]; then
              label="Generous Giver - All-in-One Installer"
            else
              label="${filename%.zip}"
            fi
            assets+=("release-assets/${filename}#${label}")
          done
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$REPOSITORY" --clobber
            gh release edit "$tag" \
              --repo "$REPOSITORY" \
              --title "Generous Giver ${VERSION}" \
              --notes-file release-assets/release-notes.md
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Generous Giver ${VERSION}" \
              --notes-file release-assets/release-notes.md
          fi
          gh release view "$tag" \
            --repo "$REPOSITORY" \
            --json assets,body,isDraft,isPrerelease,name,tagName \
            > "$RUNNER_TEMP/github-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets_dir = Path("release-assets")
          manifest = json.loads((assets_dir / "manifest.json").read_text(encoding="utf-8"))
          release = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "github-release.json").read_text(
                  encoding="utf-8"
              )
          )
          version = os.environ["VERSION"]
          if release["tagName"] != f"v{version}":
              raise SystemExit("GitHub Release tag does not match the package version.")
          if release["name"] != f"Generous Giver {version}":
              raise SystemExit("GitHub Release title does not match the package version.")
          expected_body = (assets_dir / "release-notes.md").read_text(encoding="utf-8").rstrip()
          if release["body"].rstrip() != expected_body:
              raise SystemExit("GitHub Release notes do not match the generated notes.")
          if release["isDraft"] or release["isPrerelease"]:
              raise SystemExit("GitHub Release was unexpectedly created as a draft or prerelease.")

          expected_assets = {}
          for entry in manifest["nexus_files"]:
              path = assets_dir / entry["archive"]
              expected_assets[entry["archive"].replace(" ", ".")] = {
                  "label": entry["display_name"],
                  "digest": f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}",
              }
          actual_assets = {
              entry["name"]: {"label": entry["label"], "digest": entry["digest"]}
              for entry in release["assets"]
          }
          if actual_assets != expected_assets:
              raise SystemExit(
                  "GitHub Release assets, labels, or SHA-256 digests do not match the manifest."
              )
          print("Verified the GitHub Release and all nine uploaded archives.")
          PY

  resolve-nexus:
    name: Verify existing Nexus file entries
    needs: [validate-version, package, publish-github-release]
    if: needs.validate-version.outputs.publish_nexus == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      has_uploads: ${{ steps.resolve.outputs.has_uploads }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generous-giver-release-assets
          path: release-assets

      - name: Match exact existing names and find missing versions
        id: resolve
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: python3 scripts/resolve_nexus_files.py release-assets/manifest.json

  publish-nexus:
    name: Upload new versions to existing Nexus files
    needs: [validate-version, package, resolve-nexus]
    if: needs.validate-version.outputs.publish_nexus == 'true' && needs.resolve-nexus.outputs.has_uploads == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-nexus.outputs.matrix) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download the release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generous-giver-release-assets
          path: release-assets

      - name: Upload a new version of the existing Nexus file
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ matrix.file_id }}
          filename: release-assets/${{ matrix.archive }}
          version: ${{ needs.validate-version.outputs.version }}
          # Preserve every mutable setting exposed by the Nexus file APIs.
          display_name: ${{ matrix.display_name }}
          description: ${{ matrix.description }}
          category: ${{ matrix.category }}
          primary_mod_manager_download: ${{ matrix.primary_mod_manager_download }}
          allow_mod_manager_download: ${{ matrix.allow_mod_manager_download }}
          show_requirements_pop_up: ${{ matrix.show_requirements_pop_up }}
          update_mod_version: ${{ matrix.update_mod_version }}

  verify-nexus:
    name: Verify uploaded Nexus versions
    needs: [package, resolve-nexus, publish-nexus]
    if: needs.resolve-nexus.outputs.has_uploads == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generous-giver-release-assets
          path: release-assets

      - name: Compare uploaded files with their pre-upload metadata
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          EXPECTED_NEXUS_UPLOADS_JSON: ${{ needs.resolve-nexus.outputs.matrix }}
        run: python3 scripts/verify_nexus_uploads.py release-assets/manifest.json
