name: Refresh Nexus download badge

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "America/Denver"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-download-badge
  cancel-in-progress: false

jobs:
  update-badge:
    name: Refresh the public download count
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch the public Nexus total and refresh the SVG
        run: python3 scripts/update_nexus_badge.py

      - name: Commit the updated badge
        run: |
          set -euo pipefail
          git add assets/badges/nexus-downloads.svg
          if git diff --cached --quiet; then
            echo "The published download count has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Nexus download badge"
          git push
