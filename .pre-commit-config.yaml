minimum_pre_commit_version: "4.6.2"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        files: ^\.github/workflows/.*\.ya?ml$
        types: [file]
      - id: check-xml
        files: (?i)^fomod/.*\.(xml|exml)$
        types: [file]
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (Markdown)
        entry: prettier --write --print-width 80 --prose-wrap always
        language: node
        language_version: "26.12.1"
        types: [markdown]
        additional_dependencies: [prettier@3.9.9]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: "26.12.1"
