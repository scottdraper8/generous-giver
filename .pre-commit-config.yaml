minimum_pre_commit_version: "4.6.2"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        files: ^\.github/workflows/.*\.ya?ml$
        types: [file]
      - id: check-xml
        files: (?i)^fomod/.*\.(xml|exml)$
        types: [file]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # v0.17.4
    hooks:
      - id: ruff-check
        args: [--target-version=py310, --select=E4,E7,E9,F]
        files: ^scripts/.*\.py$
      - id: ruff-format
        files: ^scripts/.*\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # v2.4.1
    hooks:
      - id: mypy
        args: [--strict, --show-error-codes, --python-version=3.10]
        files: ^scripts/.*\.py$
  - repo: local
    hooks:
      - id: prettier
        name: Prettier (Markdown)
        entry: prettier --write --print-width 80 --prose-wrap always
        language: node
        language_version: "26.12.1"
        types: [markdown]
        additional_dependencies: [prettier@3.9.9]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        language_version: "26.12.1"
